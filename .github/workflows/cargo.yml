name: Cargo Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  cargo:
    timeout-minutes: 12
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      checks: write
      packages: read
      contents: read
    steps:
    - uses: actions/checkout@v3
    - uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: 1.84.1
        override: true
        components: rustfmt, clippy, llvm-tools-preview
    - name: Setup cargo cache
      uses: Swatinem/rust-cache@v2
      continue-on-error: false
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Install nextest
      uses: taiki-e/install-action@nextest
    - name: Run cargo fmt
      run: cargo fmt --check
    - name: Run tests with coverage
      run: cargo llvm-cov --all-features --workspace --codecov --output-path codecov.json nextest
    - name: Show coverage report
      run: cargo llvm-cov report
    - name: Check link
      uses: actions-rs/clippy-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        args: --all-targets --all-features -- -D warnings
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
        files: codecov.json
        flags: ${{ runner.os }}
        fail_ci_if_error: true
    - name: Run cargo check
      run: cargo check
    - name: Validate cargo-dist config (Unix only)
      if: runner.os != 'Windows'
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.2/cargo-dist-installer.sh | sh
        dist plan
